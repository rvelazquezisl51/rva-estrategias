function save(){S.history.push(JSON.parse(JSON.stringify(S.disks)))}function disksOf(v){return S.disks.filter(d=>d.v===v&&!d.removed&&!d.exchange)}function target(v){return Math.floor(S.b/v)%10}function removed(v){return S.disks.filter(d=>d.v===v&&d.removed).length}function diskCounts(){return [100,10,1].map(v=>disksOf(v).length)}function crossedRight(){return [100,10,1].every(v=>removed(v)===target(v))}

 if(!d||d.removed||d.exchange||d.v===1)return false;
 const lower=d.v/10;
 // Only exchange when that place cannot supply the subtraction requested.
 return disksOf(lower).length<target(lower) && disksOf(d.v).length>0;
}
function canRemove(d){
 return d&&!d.removed&&!d.exchange&&removed(d.v)<target(d.v);
}
function clickDisk(id){if(S.busy)return;const d=S.disks.find(x=>x.id===id);if(!d||d.removed||d.exchange)return;if(S.selected===id){S.selected=null;render();return}if(d.v===100||d.v===10){S.selected=id;render();return}if(!canRemove(d)){S.message=S.lang==='es'?'Ya tachaste las unidades necesarias.':'You have crossed out enough ones.';render();return}save();d.removed=true;S.message='';render()}

async function exchange(){if(S.busy||!S.selected)return;const d=S.disks.find(x=>x.id===S.selected);if(!canExchange(d)){S.message=S.lang==='es'?'Solo intercambia cuando falten discos del valor menor para realizar la resta.':'Exchange only when there are not enough smaller disks to subtract.';render();return}const source=document.querySelector('[data-id="'+d.id+'"]');const dest=$('disk-'+(d.v/10));if(!source||!dest)return;save();S.busy=true;const sourceRect=source.getBoundingClientRect(),destRect=dest.getBoundingClientRect();d.exchange=true;source.classList.add('exchange');const countBefore=disksOf(d.v/10).length;const startX=sourceRect.left+sourceRect.width/2,startY=sourceRect.top+sourceRect.height/2;const layer=document.body;const flights=[];for(let i=0;i<10;i++){const f=el('div',{class:'disk flying '+(d.v/10===1?'one':'ten')},String(d.v/10));f.style.cssText+=`;left:${startX-17}px;top:${startY-17}px;width:34px;height:34px;`;layer.appendChild(f);flights.push(f)}S.message=txt('waiting');$('feedback').textContent=S.message;const newVal=d.v/10;for(let i=0;i<10;i++){const f=flights[i];const col=(countBefore+i)%5,row=Math.floor((countBefore+i)/5);const cell=Math.min(49,Math.max(25,(destRect.width-24)/5));const x=destRect.left+col*cell+cell/2+6;const y=destRect.top+row*cell+cell/2+6;const anim=f.animate([{transform:'translate(0,0) scale(.7)',opacity:.85},{transform:`translate(${(x-startX)*.5}px,${(y-startY)*.45-28}px) scale(1.05)`,opacity:1,offset:.55},{transform:`translate(${x-startX}px,${y-startY}px) scale(1)`,opacity:1}],{duration:650,fill:'forwards',easing:'ease-in-out'});await anim.finished.catch(()=>{});f.remove();S.disks.push({id:++serial,v:newVal,removed:false,exchange:false,fresh:true})}S.busy=false;S.selected=null;S.message=txt('worked');render()}
function checkDisk(){const input=$('result');if(!crossedRight()){S.message=txt('invalid');renderFeedback(false);return}if(input.value!==''&&Number(input.value)===val()&&[100,10,1].reduce((n,v)=>n+disksOf(v).length*v,0)===val()){S.message=txt('good');renderFeedback(true)}else{S.message=txt('bad');renderFeedback(false)}}

function resultInput(parent){const wrap=el('div',{class:'answer'}),lab=el('label',{},txt('answer')+' = '),inp=el('input',{id:'result',type:'number',inputmode:'numeric'});wrap.append(lab,inp);parent.append(wrap);return inp}
function diskView(){const places=el('div',{class:'places'});for(const [v,k] of [[100,'hundred'],[10,'ten'],[1,'one']]){const place=el('div',{class:'place'}),title=el('h3',{},txt(k)+' ('+disksOf(v).length+')'),grid=el('div',{class:'disks',id:'disk-'+v});for(const d of S.disks.filter(x=>x.v===v)){const disk=el('button',{type:'button','data-id':d.id,class:'disk '+(v===1?'one':v===10?'ten':'hundred')+(d.exchange?' cross exchange':'')+(d.removed?' cross removed':'')+(d.fresh?' new':'')+(S.selected===d.id?' selected':'')},String(v));disk.title=S.lang==='es'?'Tocar para seleccionar o tachar':'Tap to select or cross out';disk.onclick=()=>{if(S.busy)return;if(d.v===1)crossDisk(d.id);else if(S.selected===d.id)crossDisk(d.id);else clickDisk(d.id)};grid.append(disk)}place.append(title,grid);places.append(place)}return places}
function renderDisks(){$('prompt').textContent=S.mode===0?txt('choose')+' '+txt('guide'):txt('choose');$('workspace').append(diskView());const tip=el('div',{class:'tip'},S.lang==='es'?'Si faltan unidades para restar, selecciona una decena y pulsa «Intercambiar». Observa cómo se mueve y se transforma en 10 unidades. Después tacha solamente los discos que se restan. Las unidades se tachan con un toque.':'When there are not enough ones to subtract, select a ten and press Exchange. Watch ten ones move into place. Then cross out only the disks being subtracted.');$('workspace').append(tip);resultInput($('workspace'));const exchangeButton=action(txt('exchange'),exchange,true);exchangeButton.disabled=!canExchange(S.disks.find(x=>x.id===S.selected))||S.busy;action(txt('undo'),()=>{if(S.history.length){S.disks=S.history.pop();S.selected=null;S.message='';render()}},false).disabled=!S.history.length||S.busy;action(txt('check'),checkDisk);action(txt('reset'),resetWork);$('guidance').textContent=txt('guide')}

function renderLine(){$('prompt').textContent=txt('move');const d=linePositions(),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 960 210');svg.setAttribute('class','numberline');const add=(tag,attrs,text)=>{const x=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(text!==undefined)x.textContent=text;svg.append(x)};add('line',{x1:30,y1:155,x2:930,y2:155,stroke:'#42658a','stroke-width':2});const vals=[S.a,...S.jumps.map(j=>j.to),S.a-S.b];for(const n of [...new Set(vals)]){const x=d.x(n);add('line',{x1:x,y1:148,x2:x,y2:162,stroke:'#42658a','stroke-width':2});add('text',{x,y:181,'text-anchor':'middle',fill:'#17375c','font-size':20},String(n))}S.jumps.forEach((j,i)=>{const x1=d.x(j.from),x2=d.x(j.to),mid=(x1+x2)/2,height=25+(i%3)*18;add('path',{d:`M${x1} 150 Q${mid} ${height} ${x2} 150`,fill:'none',stroke:'#8b4cc2','stroke-width':3});add('text',{x:mid,y:height+4,'text-anchor':'middle',fill:'#7737a4','font-size':18},'−'+j.amount)});$('workspace').append(svg);const row=el('div',{class:'row'});const remaining=S.b-S.jumps.reduce((a,j)=>a+j.amount,0);row.append(el('strong',{},txt('remaining')+': '+remaining));for(const n of [1,2,5,10,20,50,100]){if(n>remaining)continue;const b=el('button',{},'−'+n);b.onclick=()=>{const from=S.jumps.length?S.jumps[S.jumps.length-1].to:S.a;S.jumps.push({from,to:from-n,amount:n});S.message='';render()};row.append(b)}$('workspace').append(row);if(remaining===0){resultInput($('workspace'));action(txt('check'),()=>checkSimple('result',val()))}action(txt('undo'),()=>{S.jumps.pop();render()}).disabled=!S.jumps.length;action(txt('reset'),()=>{S.jumps=[];render()});$('guidance').textContent=S.lang==='es'?'Elige saltos hacia la izquierda que sumen exactamente el sustraendo. Los arcos anteriores permanecen visibles.':'Choose leftward jumps that add up to the subtrahend. Earlier arcs remain visible.'}
function inp(id,placeholder='?'){return el('input',{id,type:'number',inputmode:'numeric',placeholder})}function mathInputs(parts){const w=el('div',{class:'mathline'});for(const p of parts)w.append(typeof p==='string'?el('span',{},p):inp(p.id,p.hint));$('workspace').append(w)}function checkSimple(id,expected){const n=Number($(id)?.value),valid=$(id)?.value!==''&&n===expected;S.message=valid?txt('good'):txt('bad');renderFeedback(valid);return valid}
function renderBond(){$('prompt').textContent=txt('bond');const w=el('div',{class:'bond'}),whole=el('div',{class:'top'},String(S.b)),branches=el('div',{class:'branches'},'↙     ↘'),parts=el('div',{class:'parts'});parts.append(inp('part1'),inp('part2'));w.append(whole,branches,parts);$('workspace').append(w);mathInputs([String(S.a),'−',{id:'bond1'},'−',{id:'bond2'},'= ',{id:'result'}]);action(txt('check'),()=>{const p=Number($('part1').value),q=Number($('part2').value);const ok=['part1','part2','bond1','bond2','result'].every(id=>$(id).value!=='')&&p>0&&q>0&&p+q===S.b&&Number($('bond1').value)===p&&Number($('bond2').value)===q&&Number($('result').value)===val();S.message=ok?txt('good'):txt('bad');renderFeedback(ok)});action(txt('hint'),()=>{$('guidance').textContent=`${S.b} = ${Math.floor(S.b/10)*10} + ${S.b%10}. ${S.a} − ${Math.floor(S.b/10)*10} − ${S.b%10} = ?`})}
function renderComp(){$('prompt').textContent=txt('comp');const rounded=Math.ceil(S.b/10)*10;mathInputs([String(S.a),'−',String(rounded),'=',{id:'intermediate'}]);mathInputs([{id:'intermediate2'},'+',{id:'adjust'},'=',{id:'result'}]);action(txt('check'),()=>{const ok=$('intermediate').value!==''&&$('intermediate2').value!==''&&$('adjust').value!==''&&$('result').value!==''&&Number($('intermediate').value)===S.a-rounded&&Number($('intermediate2').value)===S.a-rounded&&Number($('adjust').value)===rounded-S.b&&Number($('result').value)===val();S.message=ok?txt('good'):txt('bad');renderFeedback(ok)});$('guidance').textContent=S.lang==='es'?`Restamos ${rounded} en lugar de ${S.b}. ¿Cuánto debemos devolver?`:`Subtract ${rounded} instead of ${S.b}. How much should we add back?`}
function renderForward(){$('prompt').textContent=txt('forward');mathInputs([String(S.b),'+',{id:'forward'},'=',String(S.a)]);action(txt('check'),()=>checkSimple('forward',val()));$('guidance').textContent=S.lang==='es'?`Cuenta de ${S.b} hasta ${S.a} usando saltos que te resulten convenientes.`:`Count from ${S.b} to ${S.a} using convenient jumps.`}
function renderInverse(){$('prompt').textContent=txt('inverse');mathInputs([String(S.b),'+',{id:'inverse'},'=',String(S.a)]);action(txt('check'),()=>checkSimple('inverse',val()));$('guidance').textContent=S.lang==='es'?'La suma permite comprobar la resta: sustraendo + diferencia = minuendo.':'Addition checks subtraction: subtrahend + difference = minuend.'}
function renderCompare(){$('prompt').textContent=txt('compare');const rounded=Math.ceil(S.b/10)*10;mathInputs([String(S.a),'−',String(Math.floor(S.b/10)*10),'−',String(S.b%10),'=',{id:'compare1'}]);mathInputs([String(S.a),'−',String(rounded),'+',String(rounded-S.b),'=',{id:'compare2'}]);action(txt('check'),()=>{const ok=$('compare1').value!==''&&$('compare2').value!==''&&Number($('compare1').value)===val()&&Number($('compare2').value)===val();S.message=ok?txt('good'):txt('bad');renderFeedback(ok)});$('guidance').textContent=txt('different')}
function renderError(){$('prompt').textContent=txt('error');const proposed=val()+(S.a%2===0?10:0);$('workspace').append(el('div',{class:'problem'},`${S.a} − ${S.b} = ${proposed}`));const row=el('div',{class:'row'}),sel=el('select',{id:'correctness'});sel.append(el('option',{value:''},'—'),el('option',{value:'yes'},txt('yes')),el('option',{value:'no'},txt('no')));row.append(el('label',{},txt('correct')+'?'),sel);$('workspace').append(row);mathInputs([txt('answer'),{id:'result'}]);action(txt('check'),()=>{const ok=sel.value===(proposed===val()?'yes':'no')&&$('result').value!==''&&Number($('result').value)===val();S.message=ok?txt('good'):txt('bad');renderFeedback(ok)});$('guidance').textContent=txt('errorPrompt')+' '+proposed+'. '+txt('error')}
function renderWord(){$('prompt').textContent=txt('word');$('workspace').append(el('div',{class:'tip'},txt('wordText').replace('{a}',S.a).replace('{b}',S.b)));mathInputs([String(S.a),'−',String(S.b),'=',{id:'result'}]);action(txt('check'),()=>checkSimple('result',val()));$('guidance').textContent=txt('word')}
$('lang').onchange=e=>{S.lang=e.target.value;render()};$('method').onchange=e=>{S.method=Number(e.target.value);S.mode===0?example():randomProblem()};$('digits').onchange=e=>{S.digits=Number(e.target.value);S.mode===0?example():randomProblem()};$('newProblem').onclick=()=>randomProblem();example();
</script></body></html>
